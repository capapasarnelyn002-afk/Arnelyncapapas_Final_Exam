<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Additional styles for layout and UI */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .wrapper {
            display: flex;
        }

        /* Sidebar styles */
        #sidebar {
            width: 250px;
            background: #343a40;
            color: white;
            height: 100vh;
            padding: 1rem;
            position: fixed;
        }

        #sidebar .nav-link {
            color: #adb5bd;
            padding: 10px;
            display: block;
            text-decoration: none;
        }

        #sidebar .nav-link:hover {
            background-color: #495057;
            color: white;
        }

        #content {
            margin-left: 250px;
            padding: 2rem;
            width: calc(100% - 250px);
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .table {
            margin-top: 2rem;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
        <h3 class="text-white">S-Portal</h3>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#" onclick="showHome()">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="showForm()">Add Student</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Courses</a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div id="content">
        <!-- Student List -->
        <div id="list-section">
            <h2>Student List</h2>
            <button class="btn btn-primary" onclick="showForm()">+ New Student</button>
            
            <table class="table table-bordered table-striped mt-3">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Course</th>
                        <th>Year Level</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    <!-- Student data will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Add/Edit Student Form -->
        <div id="form-section" style="display: none;">
            <div class="form-card">
                <h3 id="form-title">Add New Student</h3>
                <form id="student-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="db_id">
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" id="student_id" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <input type="text" id="course" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Year Level</label>
                        <input type="text" id="year_level" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                    <button type="button" class="btn btn-secondary" onclick="showHome()">Cancel</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/students';

    // Show Student List
    function showHome() {
        document.getElementById('list-section').style.display = 'block';
        document.getElementById('form-section').style.display = 'none';
        fetchStudents();
    }

    // Show Add/Edit Student Form
    function showForm(student = null) {
        document.getElementById('list-section').style.display = 'none';
        document.getElementById('form-section').style.display = 'block';

        if (student) {
            document.getElementById('form-title').innerText = 'Edit Student';
            document.getElementById('db_id').value = student.id;
            document.getElementById('student_id').value = student.student_id;
            document.getElementById('full_name').value = student.full_name;
            document.getElementById('course').value = student.course;
            document.getElementById('year_level').value = student.year_level;
            document.getElementById('email').value = student.email;
        } else {
            document.getElementById('form-title').innerText = 'Add New Student';
            document.getElementById('student-form').reset();
        }
    }

    // Fetch all students from the backend and display them in the table
    async function fetchStudents() {
        const response = await fetch(API_URL);
        const students = await response.json();
        const tbody = document.getElementById('student-table-body');
        tbody.innerHTML = '';

        students.forEach(student => {
            tbody.innerHTML += `
                <tr>
                    <td>${student.student_id}</td>
                    <td>${student.full_name}</td>
                    <td>${student.course}</td>
                    <td>${student.year_level}</td>
                    <td>${student.email}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="showForm(${JSON.stringify(student)})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // Handle form submission (Add or Update Student)
    async function handleFormSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('db_id').value;
        const studentData = {
            student_id: document.getElementById('student_id').value,
            full_name: document.getElementById('full_name').value,
            course: document.getElementById('course').value,
            year_level: document.getElementById('year_level').value,
            email: document.getElementById('email').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        const response = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(studentData)
        });

        if (response.ok) {
            showHome();  // Reload student list after successful submission
        } else {
            alert('Failed to save student.');
        }
    }

    // Delete a student
    async function deleteStudent(id) {
        if (confirm("Are you sure you want to delete this student?")) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchStudents();  // Reload the student list after deletion
        }
    }

    // Initial load
    showHome();
</script>

</body>
</html>
